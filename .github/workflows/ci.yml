name: F Anime checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/orange-multilingual-discovery]

permissions:
  contents: read

concurrency:
  group: f-anime-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint, typecheck and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
